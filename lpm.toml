schema_version = 1

[project]
package = "lilygo-ui-picoclaw"
version = "0.1.0"
app_id = "cc.lilygo.ui.PicoClaw"
title = "PicoClaw"
summary = "Private AI assistant for LILYGO UI"
description = "Chat with PicoClaw, configure model providers, and manage the local PicoClaw gateway from a responsive LILYGO UI application."
license = "MIT"
source_repo = "https://github.com/LILYGO-UI/lilygo-ui-picoclaw"
homepage = "https://github.com/sipeed/picoclaw"
categories = ["Utilities", "Network"]

[[project.authors]]
name = "lbuque"
email = "110239031@qq.com"

[project.assets]
icon = "assets/app-icon.png"

[[project.assets.screenshots]]
path = "assets/previews/preview1.png"
caption = "Main application screen"

[[project.permissions]]
id = "network"
reason = "Access online application data"

[[project.permissions]]
id = "filesystem"
access = "read-write"
scope = "app-data"
reason = "Store application settings"

[project.compatibility]
architectures = ["arm64"]
min_appkit_version = "0.1.0"

[project.launcher]
order = 40

[build]
host_preset = "host-simulator"
cross_preset = "cm0-cross"
package_dir = "dist"

[deploy]
host = "raspberrypi.local"
user = "pi"
port = 22
